<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Kiln Bound — staged combat review</title>
    <style>
      body {
        margin: 0;
        background: #1c1d1c;
        color: #d1c5ab;
        font: 14px Georgia;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
      }
      button {
        position: fixed;
        bottom: 16px;
        right: 16px;
        padding: 10px 20px;
        background: #302e28;
        color: #e4d4b3;
        border: 1px solid #80735e;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="play">Replay duel</button>
    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { createParishRig } from "/src/gameplay/parishModels.ts";
      import { applyParishRigPose } from "/src/gameplay/parishRigPose.ts";
      import {
        createParishEncounter,
        stepParishEnemy,
        hitParishEnemy,
      } from "/src/gameplay/parishEncounter.ts";
      import { newParishProgress, parishShrines } from "/src/gameplay/ashenParish.ts";
      import { PLAYER_MODEL } from "/src/gameplay/characterAnimations.ts";
      import {
        dodgeInvulnerable,
        rollSpeedAt,
        ROLL_SPEED,
        ROLL_DURATION,
      } from "/src/gameplay/playerRules.ts";
      const W = 1920,
        H = 1080,
        dt = 1 / 60;
      const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      renderer.setSize(W, H);
      renderer.setPixelRatio(1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      const canvas = document.createElement("canvas");
      canvas.width = W;
      canvas.height = H;
      document.body.prepend(canvas);
      const ctx = canvas.getContext("2d", { alpha: false });
      const scene = new THREE.Scene();
      scene.background = new THREE.Color("#252c2b");
      scene.fog = new THREE.Fog("#252c2b", 18, 38);
      const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 70);
      scene.add(new THREE.HemisphereLight("#b0b9b7", "#413225", 2));
      const sun = new THREE.DirectionalLight("#ffe4bb", 3);
      sun.position.set(-4, 10, 6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {
        left: -12,
        right: 12,
        top: 12,
        bottom: -12,
        near: 0.1,
        far: 30,
      });
      sun.shadow.bias = -0.0005;
      scene.add(sun);
      const rim = new THREE.DirectionalLight("#a9c0cd", 1.5);
      rim.position.set(5, 6, -6);
      scene.add(rim);
      // A small foundry courtyard for combat review, using deliberately coarse stonework.
      const tile = document.createElement("canvas");
      tile.width = 128;
      tile.height = 128;
      const tc = tile.getContext("2d");
      tc.fillStyle = "#363730";
      tc.fillRect(0, 0, 128, 128);
      for (let y = 0; y < 4; y++)
        for (let x = 0; x < 4; x++) {
          const shade = 62 + ((x * 13 + y * 7) % 24);
          tc.fillStyle = `rgb(${shade + 7},${shade + 5},${shade})`;
          tc.fillRect(x * 32 + 2, y * 32 + 2, 28, 28);
          tc.fillStyle = "#787267";
          tc.fillRect(x * 32 + 3, y * 32 + 3, 26, 1);
          for (let j = 0; j < 14; j++) {
            tc.fillStyle = j % 2 ? "#5b594e" : "#47483e";
            tc.fillRect(x * 32 + 4 + ((j * 7) % 24), y * 32 + 4 + ((j * 11) % 24), 2, 2);
          }
        }
      const texture = new THREE.CanvasTexture(tile);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
      texture.repeat.set(12, 12);
      texture.colorSpace = THREE.SRGBColorSpace;
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(32, 32),
        new THREE.MeshStandardMaterial({ map: texture, roughness: 1 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);
      const stone = new THREE.MeshStandardMaterial({ color: "#666456", roughness: 1 });
      const iron = new THREE.MeshStandardMaterial({ color: "#302c26", roughness: 0.9 });
      function block(x, y, z, sx, sy, sz, mat = stone) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), mat);
        m.position.set(x, y, z);
        m.castShadow = m.receiveShadow = true;
        scene.add(m);
        return m;
      }
      for (let i = 0; i < 12; i++) {
        block(-9 + i * 1.65, 0.55, -5.5, 1.5, 1.1, 0.85);
        if (i < 3 || i > 8)
          for (let row = 1; row < 4; row++)
            block(-9 + i * 1.65, row * 1.05 + 0.55, -5.5, 1.5, 1, 0.85);
      }
      for (const x of [-7, -4, 4, 7]) {
        block(x, 0.2, -4, 1.5, 0.4, 1.5);
        block(x, 2, -4, 0.9, 3.6, 0.9);
        block(x, 3.9, -4, 1.35, 0.3, 1.35);
      }
      // Portal arch beyond the duel, with a restrained ember-coloured interior.
      for (const x of [-1.8, 1.8]) block(x, 1.8, -6, 0.65, 3.6, 0.8);
      for (let i = 0; i < 9; i++) {
        const a = (i * Math.PI) / 8,
          m = block(Math.cos(a) * 1.8, 3.5 + Math.sin(a) * 1.6, -6, 0.7, 0.65, 0.8);
        m.rotation.z = a - Math.PI / 2;
      }
      const portal = new THREE.Mesh(
        new THREE.PlaneGeometry(2.8, 3.7),
        new THREE.MeshBasicMaterial({
          color: "#9a4b21",
          transparent: true,
          opacity: 0.23,
          side: THREE.DoubleSide,
        }),
      );
      portal.position.set(0, 2.1, -6.1);
      scene.add(portal);
      for (const x of [-3.1, 3.1]) {
        block(x, 0.55, -3.6, 0.8, 1.1, 0.8, iron);
        const coal = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.32, 0),
          new THREE.MeshBasicMaterial({ color: "#db7b31" }),
        );
        coal.position.set(x, 1.2, -3.6);
        scene.add(coal);
        const glow = new THREE.PointLight("#ef8836", 8, 6);
        glow.position.copy(coal.position);
        scene.add(glow);
      }
      for (let i = 0; i < 16; i++) {
        const a = i * 2.4;
        const m = block(
          Math.sin(a) * (7 + (i % 3)),
          0.12,
          Math.cos(a) * (6 + (i % 4)),
          0.22 + (i % 3) * 0.13,
          0.24,
          0.32,
        );
        m.rotation.set(0.1, i, 0.14);
      }
      const rig = createParishRig("kiln");
      scene.add(rig.root);
      const gltf = await new GLTFLoader().loadAsync(PLAYER_MODEL.path);
      const player = new THREE.Group();
      player.add(gltf.scene);
      gltf.scene.scale.setScalar(PLAYER_MODEL.unitScale);
      scene.add(player);
      gltf.scene.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = o.receiveShadow = true;
          if (o.material.map) {
            o.material.map.magFilter = THREE.NearestFilter;
            o.material.map.minFilter = THREE.NearestMipmapNearestFilter;
          }
        }
      });
      const mixer = new THREE.AnimationMixer(gltf.scene);
      const actions = Object.fromEntries(
        gltf.animations.map((clip) => [clip.name, mixer.clipAction(clip)]),
      );
      let current = null;
      function animate(name) {
        if (name === current) return;
        const previous = actions[current];
        const next = actions[name] ?? actions.Idle;
        next.reset();
        next.setEffectiveWeight(1);
        if (["Roll", "SwordSlashQuick", "RecieveHit"].includes(name)) {
          next.setLoop(THREE.LoopOnce, 1);
          next.clampWhenFinished = true;
        } else next.setLoop(THREE.LoopRepeat, Infinity);
        next.play();
        if (previous) previous.crossFadeTo(next, 0.1, false);
        current = name;
      }
      const rounds = [
        {
          move: "sweep",
          length: 7,
          start: 1.2,
          roll: 2.2,
          slash: 3.7,
          title: "SWEEP / ROLL THROUGH, THEN COUNTER",
        },
        {
          move: "slam",
          length: 9,
          start: 1.2,
          roll: 3.22,
          slash: 5.65,
          title: "FLIPPED SLAM / ESCAPE THE SHOCKWAVE",
        },
        {
          move: "check",
          length: 7,
          start: 1.3,
          roll: -10,
          slash: 3.05,
          title: "SHOULDER CHECK / CROWDING GETS PUNISHED",
        },
      ];
      const progress = newParishProgress();
      const world = {
        campaign: true,
        spawns: [{ id: "kiln", kind: "kiln", position: [0, 0, 0], area: "yard" }],
        shrines: parishShrines,
        floorHeight: () => 0,
        blocked: () => false,
        lineClear: () => true,
      };
      let state,
        e,
        roundIndex = -1,
        time = 0,
        local = 0,
        committed = false,
        countered = false,
        rolling = false,
        hitAt = -10,
        previousHealth = 100,
        carryHealth = 100,
        carryEnemy = 230,
        events = [];
      function beginRound(index) {
        if (state) {
          carryHealth = state.combat.health;
          carryEnemy = e.health;
        }
        state = createParishEncounter(progress, world);
        e = state.enemies[0];
        Object.assign(e, { phase: "guard", health: carryEnemy, yaw: 0 });
        Object.assign(state.combat, {
          playerX: index === 0 ? 0.8 : 0,
          playerZ: index === 2 ? 2.2 : 2.6,
          playerY: 0,
          playerYaw: Math.PI,
          health: carryHealth,
        });
        roundIndex = index;
        committed = countered = rolling = false;
        hitAt = -10;
        previousHealth = carryHealth;
        current = null;
        mixer.stopAllAction();
      }
      function reset() {
        roundIndex = -1;
        state = null;
        time = 0;
        carryHealth = 100;
        carryEnemy = 230;
        events = [];
        mixer.stopAllAction();
        current = null;
      }
      function toward(x, z, speed) {
        const c = state.combat,
          dx = x - c.playerX,
          dz = z - c.playerZ,
          d = Math.hypot(dx, dz),
          step = Math.min(d, speed * dt);
        if (d > 0.001) {
          c.playerX += (dx / d) * step;
          c.playerZ += (dz / d) * step;
        }
        return step / dt;
      }
      function tick() {
        const absolute = time;
        let index = 0,
          t = absolute;
        while (index < rounds.length - 1 && t >= rounds[index].length) {
          t -= rounds[index].length;
          index++;
        }
        if (index !== roundIndex) beginRound(index);
        local = t;
        const r = rounds[index],
          c = state.combat;
        c.hurtTime = Math.max(0, c.hurtTime - dt);
        c.hitStop = 0;
        c.shake *= 0.9;
        e.flash = Math.max(0, e.flash - dt * 4);
        const rollElapsed = t - r.roll,
          rollActive = index < 2 && rollElapsed >= 0 && rollElapsed < ROLL_DURATION;
        const slashElapsed = t - r.slash,
          slashActive = slashElapsed >= 0 && slashElapsed < 0.62;
        c.invulnerable = rollActive && dodgeInvulnerable(false, rollElapsed, "medium");
        c.guarding = false;
        let pace = 0,
          yaw = Math.atan2(e.x - c.playerX, e.z - c.playerZ),
          clip = "Guard";
        if (c.hurtTime > 0) {
          clip = "RecieveHit";
          c.playerX += c.knockX * dt;
          c.playerZ += c.knockZ * dt;
          c.knockX *= Math.exp(-8 * dt);
          c.knockZ *= Math.exp(-8 * dt);
        } else if (rollActive) {
          const dx = index === 0 ? 0.75 : 0,
            dz = index === 0 ? -0.66 : 1,
            n = Math.hypot(dx, dz),
            speed = rollSpeedAt(ROLL_SPEED, rollElapsed, ROLL_DURATION);
          c.playerX += (dx / n) * speed * dt;
          c.playerZ += (dz / n) * speed * dt;
          yaw = Math.atan2(dx, dz);
          clip = "Roll";
        } else if (slashActive) {
          clip = "SwordSlashQuick";
        } else if (index === 0) {
          if (t < 1.1) pace = toward(0, 2.6, 1.8);
          else if (t > 3.12 && t < 3.7) pace = toward(1.15, 0.9, 5.5);
          else if (t > 4.5) pace = toward(1.4, 2.4, 1.5);
        } else if (index === 1) {
          if (t > 4.15 && t < 5.65) pace = toward(0, 1.8, 4.2);
          else if (t > 6.5) pace = toward(0.8, 2.6, 1.2);
        } else {
          if (t < 1.25) pace = toward(0, 1.05, 1.6);
          else if (t > 2.65 && t < 3.05) pace = toward(0, 1.7, 2.2);
          else if (t > 4) pace = toward(0.9, 2.7, 1.2);
        }
        if (!rollActive && c.hurtTime <= 0 && !slashActive && pace > 0.05)
          clip = pace > 2.5 ? "Run" : "Walk";
        if (!committed && t >= r.start) {
          Object.assign(e, {
            phase: "windup",
            kilnAttack: r.move,
            timer: 0,
            hit: false,
            comboStep: 0,
            attackNumber: index * 2 + 2,
          });
          committed = true;
          events.push({ time, move: r.move, event: "windup" });
        }
        if (committed && ["windup", "strike", "recovery", "stagger"].includes(e.phase))
          stepParishEnemy(state, e, dt, progress);
        if (e.phase === "pursue") {
          e.phase = "guard";
          e.timer = 0;
        }
        if (c.health < previousHealth) {
          hitAt = t;
          events.push({ time, move: r.move, event: "player hit", health: c.health });
          previousHealth = c.health;
        }
        if (!countered && slashElapsed >= 0.25) {
          const distance = Math.hypot(c.playerX - e.x, c.playerZ - e.z);
          if (distance < 2.6) {
            hitParishEnemy(state, e);
            events.push({
              time,
              move: r.move,
              event: "counter",
              distance,
              phase: e.phase,
              enemyHealth: e.health,
            });
          }
          countered = true;
        }
        c.playerYaw = yaw;
        player.position.set(c.playerX, 0, c.playerZ);
        const delta = Math.atan2(
          Math.sin(yaw - player.rotation.y),
          Math.cos(yaw - player.rotation.y),
        );
        player.rotation.y += delta * Math.min(1, dt * 18);
        animate(clip);
        mixer.update(dt);
        rig.root.position.set(e.x, 0, e.z);
        rig.root.rotation.y = e.yaw;
        applyParishRigPose(rig, e, time, false, dt);
        const target =
          index === 1 ? new THREE.Vector3(0, 1.15, 2.2) : new THREE.Vector3(0.4, 1.1, 0.8);
        camera.position.set(index === 1 ? 8 : 6.5, index === 1 ? 6.3 : 4.8, index === 1 ? 13 : 9);
        camera.lookAt(target);
        renderer.render(scene, camera);
        ctx.drawImage(renderer.domElement, 0, 0);
        // Video HUD is drawn from the real encounter records.
        ctx.fillStyle = "rgba(16,17,16,.78)";
        ctx.fillRect(0, 0, W, 105);
        ctx.fillRect(0, H - 108, W, 108);
        ctx.fillStyle = "#d7c7a4";
        ctx.font = "28px Georgia";
        ctx.fillText("KILN BOUND / FOUNDRY DUEL", 48, 45);
        ctx.font = "14px monospace";
        ctx.fillStyle = "#a8ab9d";
        ctx.fillText(
          "STAGED COMBAT REVIEW · ACTUAL PLAYER / ENEMY RIGS AND HIT DETECTION · 60 FPS",
          48,
          78,
        );
        function bar(x, y, width, value, max, color) {
          ctx.fillStyle = "#292721";
          ctx.fillRect(x, y, width, 10);
          ctx.fillStyle = color;
          ctx.fillRect(x, y, width * Math.max(0, value / max), 10);
        }
        ctx.font = "16px Georgia";
        ctx.fillStyle = "#d7c7a4";
        ctx.fillText("PILGRIM", 48, 137);
        bar(48, 151, 240, c.health, 100, "#9e4f3f");
        ctx.fillText("KILN BOUND", W - 365, 137);
        bar(W - 365, 151, 310, e.health, 230, "#9e4f3f");
        ctx.font = "24px Georgia";
        ctx.fillStyle = "#d7c7a4";
        ctx.fillText(`${index + 1} / ${r.title}`, 48, H - 63);
        ctx.font = "15px monospace";
        ctx.fillStyle = "#a8ab9d";
        const note =
          c.hurtTime > 0
            ? "BODY CHECK CONNECTS / PLAYER KNOCKBACK"
            : slashActive
              ? "COUNTERATTACK / RECOVERY OPENING"
              : rollActive
                ? "DODGE / MEDIUM ROLL"
                : e.phase === "windup"
                  ? "READ THE WINDUP"
                  : e.phase === "strike"
                    ? r.move === "slam"
                      ? "GROUND IMPACT / EXPANDING SHOCKWAVE"
                      : "COMMITTED ATTACK"
                    : e.phase === "recovery"
                      ? "ENEMY RECOVERY / PUNISH WINDOW"
                      : "CONTROL THE DISTANCE";
        ctx.fillText(note, 48, H - 30);
        time += dt;
      }
      let running = false,
        exporting = false,
        last = 0,
        accumulator = 0;
      function frame(now) {
        if (running && !exporting) {
          if (last) accumulator += Math.min(0.1, (now - last) / 1000);
          while (accumulator >= dt && time < 23) {
            tick();
            accumulator -= dt;
          }
        }
        last = now;
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
      window.battleReview = {
        ready: true,
        events: () => events,
        play() {
          reset();
          running = true;
        },
        async exportVideo() {
          running = false;
          exporting = true;
          reset();
          const chunks = [];
          const status = { frame: 0, total: 1380, done: false, error: null };
          this.status = status;
          const encoder = new VideoEncoder({
            output(chunk) {
              const b = new Uint8Array(chunk.byteLength);
              chunk.copyTo(b);
              chunks.push(b);
            },
            error(err) {
              status.error = String(err);
            },
          });
          try {
            encoder.configure({
              codec: "avc1.42002a",
              width: W,
              height: H,
              bitrate: 14000000,
              framerate: 60,
              avc: { format: "annexb" },
            });
            for (let i = 0; i < status.total; i++) {
              tick();
              const f = new VideoFrame(canvas, {
                timestamp: Math.round((i * 1e6) / 60),
                duration: Math.round(1e6 / 60),
              });
              encoder.encode(f, { keyFrame: i % 120 === 0 });
              f.close();
              status.frame = i + 1;
              if (encoder.encodeQueueSize > 6) await encoder.flush();
              await new Promise((r) => setTimeout(r, 0));
            }
            await encoder.flush();
            const bytes = new Uint8Array(chunks.reduce((s, b) => s + b.length, 0));
            let offset = 0;
            for (const b of chunks) {
              bytes.set(b, offset);
              offset += b.length;
            }
            this.bytes = bytes;
            status.done = true;
            this.summary = { events, playerHealth: state.combat.health, enemyHealth: e.health };
          } catch (err) {
            status.error = String(err);
          } finally {
            encoder.close();
            exporting = false;
          }
          return status;
        },
      };
      document.querySelector("#play").onclick = () => window.battleReview.play();
      reset();
      tick();
      document.body.dataset.ready = "true";
    </script>
  </body>
</html>
